<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketMind AI - Human Approval Gate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function MarketMindDashboard() {
      const [activeTab, setActiveTab] = useState('review');
      const [reviewDecision, setReviewDecision] = useState(null);
      
      const reportData = {
        report_id: "REP-2026-0941",
        total_cost: "$0.482",
        qc_status: "PASSED_WITH_WARNINGS",
        confidence: "MEDIUM_HIGH",
        claim_breakdown: { fact: 18, inference: 6, recommendation: 3, uncertainty: 2 },
        limitations: [
          "Vendor 'DataPulse AI' private pricing enterprise tiers could not be established.",
          "Regulatory constraints for APAC regions are inferred based on EU AI Act equivalency frameworks."
        ],
        claims: [
          {
            id: "CLM-001",
            text: "SupportFlow AI offers an entry-tier subscription at $49/seat/month.",
            type: "fact",
            source_ref: "TR-88a2f1",
            confidence: "HIGH"
          },
          {
            id: "CLM-002",
            text: "The mid-market segment is shifting toward agentic resolution models over workflow automation.",
            type: "inference",
            source_ref: "TR-11c90e",
            confidence: "MEDIUM"
          },
          {
            id: "CLM-003",
            text: "Enterprise acquisition strategy should target narrow vertical integrations in logistics.",
            type: "recommendation",
            source_ref: "TR-55d820",
            confidence: "HIGH"
          }
        ]
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/50 px-6 py-4 flex justify-between items-center backdrop-blur">
            <div className="flex items-center space-x-3">
              <span className="text-xl font-bold tracking-tight bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
                MarketMind AI
              </span>
              <span className="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700">
                v2026.1 API
              </span>
            </div>
            <div className="flex items-center space-x-6 text-sm">
              <div className="flex items-center space-x-2">
                <span className="text-slate-400">Run Cost:</span>
                <span className="font-mono font-medium text-slate-200">{reportData.total_cost}</span>
              </div>
              <div className="flex items-center space-x-2">
                <span className="text-slate-400">QC Status:</span>
                <span className="text-emerald-400 font-medium">{reportData.qc_status}</span>
              </div>
            </div>
          </header>

          {/* Main Layout */}
          <div className="flex h-[calc(100vh-65px)]">
            {/* Sidebar */}
            <aside className="w-64 border-r border-slate-800 bg-slate-900/30 p-4 space-y-2">
              <button 
                onClick={() => setActiveTab('review')}
                className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                  activeTab === 'review' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800/50'
                }`}
              >
                <span>Human Approval Gate</span>
              </button>
              <button 
                onClick={() => setActiveTab('evidence')}
                className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                  activeTab === 'evidence' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800/50'
                }`}
              >
                <span>Evidence Appendix</span>
              </button>
            </aside>

            {/* Panel */}
            <main className="flex-1 p-8 overflow-y-auto bg-slate-950">
              {activeTab === 'review' && (
                <div className="max-w-4xl mx-auto space-y-6">
                  {/* Metrics */}
                  <div className="grid grid-cols-4 gap-4">
                    <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                      <div className="text-xs text-slate-400 font-medium">FACT CLAIMS</div>
                      <div className="text-2xl font-bold text-slate-100 mt-1">{reportData.claim_breakdown.fact}</div>
                    </div>
                    <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                      <div className="text-xs text-slate-400 font-medium">INFERENCES</div>
                      <div className="text-2xl font-bold text-amber-400 mt-1">{reportData.claim_breakdown.inference}</div>
                    </div>
                    <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                      <div className="text-xs text-slate-400 font-medium">RECOMMENDATIONS</div>
                      <div className="text-2xl font-bold text-indigo-400 mt-1">{reportData.claim_breakdown.recommendation}</div>
                    </div>
                    <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                      <div className="text-xs text-slate-400 font-medium">UNCERTAINTIES</div>
                      <div className="text-2xl font-bold text-rose-400 mt-1">{reportData.claim_breakdown.uncertainty}</div>
                    </div>
                  </div>

                  {/* Limitations */}
                  <div className="bg-amber-950/20 border border-amber-500/30 rounded-xl p-5">
                    <div className="text-amber-400 font-semibold text-sm mb-3">
                      IDENTIFIED LIMITATIONS & GAPS
                    </div>
                    <ul className="list-disc list-inside space-y-1.5 text-sm text-amber-200/80">
                      {reportData.limitations.map((item, idx) => (
                        <li key={idx}>{item}</li>
                      ))}
                    </ul>
                  </div>

                  {/* Findings */}
                  <div className="bg-slate-900/40 border border-slate-800 rounded-xl p-6 space-y-4">
                    <h3 className="text-lg font-semibold text-slate-200 border-b border-slate-800 pb-3">
                      Key Findings & Epistemic Classification
                    </h3>
                    <div className="space-y-3">
                      {reportData.claims.map((claim) => (
                        <div key={claim.id} className="p-4 bg-slate-900/90 border border-slate-800 rounded-lg flex items-start justify-between">
                          <div className="space-y-1.5 pr-4">
                            <div className="text-sm text-slate-200">{claim.text}</div>
                            <div className="text-xs font-mono text-slate-500">Source Reference: {claim.source_ref}</div>
                          </div>
                          <span className={`text-xs px-2.5 py-1 rounded-full font-semibold uppercase tracking-wider ${
                            claim.type === 'fact' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                            claim.type === 'inference' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' :
                            'bg-indigo-500/10 text-indigo-400 border border-indigo-500/20'
                          }`}>
                            {claim.type}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Decision Panel */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
                    <h3 className="text-md font-semibold text-slate-300">Human Sign-off & Decision Pipeline</h3>
                    <div className="grid grid-cols-4 gap-3">
                      <button 
                        onClick={() => setReviewDecision('APPROVED')}
                        className="bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-lg text-sm font-medium transition"
                      >
                        Approve Brief
                      </button>
                      <button 
                        onClick={() => setReviewDecision('REJECTED')}
                        className="bg-rose-600 hover:bg-rose-500 text-white p-3 rounded-lg text-sm font-medium transition"
                      >
                        Reject
                      </button>
                      <button 
                        onClick={() => setReviewDecision('EXPAND')}
                        className="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-lg text-sm font-medium transition"
                      >
                        Expand Scope
                      </button>
                      <button 
                        onClick={() => setReviewDecision('RESCOPE')}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-200 p-3 rounded-lg text-sm font-medium transition"
                      >
                        Modify Scope
                      </button>
                    </div>
                    {reviewDecision && (
                      <div className="mt-4 p-3 bg-indigo-950/40 border border-indigo-500/40 rounded text-sm text-indigo-300 font-mono">
                        Decision Routed: Action [{reviewDecision}] recorded for audit logging.
                      </div>
                    )}
                  </div>
                </div>
              )}

              {activeTab === 'evidence' && (
                <div className="max-w-4xl mx-auto space-y-4">
                  <h2 className="text-xl font-bold text-slate-200">Evidence Appendix & Traceability Log</h2>
                  <p className="text-sm text-slate-400">
                    Every extracted claim strictly resolves to an explicit tool result identifier.
                  </p>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-300 overflow-x-auto">
                    <pre>{JSON.stringify(reportData.claims, null, 2)}</pre>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MarketMindDashboard />);
  </script>
</body>
</html>
